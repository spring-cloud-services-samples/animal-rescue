plugins {
	id 'org.springframework.boot' version '4.0.3'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.gorylenko.gradle-git-properties' version '2.5.0'
	id 'java'
	id 'jacoco'
}

group = 'io.spring.cloud.samples.animalrescue'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
	maven { url = 'https://repo.spring.io/milestone' }
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:2.0.0-M2"
	}
}

dependencies {
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	implementation "org.springframework.cloud:spring-cloud-bindings:2.0.4"

	implementation "org.springframework.security:spring-security-web"

	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation "org.springframework.security:spring-security-oauth2-resource-server"
	implementation "org.springframework.security:spring-security-oauth2-jose"
	implementation('io.pivotal.cfenv:java-cfenv-boot:4.0.0') {
		exclude group: 'org.springframework.boot', module: 'spring-boot-starter-webmvc'
		exclude group: 'org.springframework.boot', module: 'spring-boot-starter-tomcat'
	}
	implementation 'org.springdoc:springdoc-openapi-starter-webflux-api:3.0.2'

	implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webflux'
	implementation 'org.springframework.ai:spring-ai-mcp-annotations'
	implementation 'io.modelcontextprotocol.sdk:mcp'

	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'io.r2dbc:r2dbc-h2'

	testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'io.projectreactor:reactor-test'
	testImplementation('io.pivotal.cfenv:java-cfenv-test-support:4.0.0') {
		exclude group: 'org.springframework.boot', module: 'spring-boot-starter-webmvc'
		exclude group: 'org.springframework.boot', module: 'spring-boot-starter-webmvc-test'
		exclude group: 'org.springframework.boot', module: 'spring-boot-starter-tomcat'
	}
}

gitProperties {
	dotGitDirectory = rootProject.layout.projectDirectory.dir(".git")
}

test {
	useJUnitPlatform()
	testLogging {
		exceptionFormat = "full"
		events = ["passed", "skipped", "failed"]
	}
}
