server:
  port: 8081

spring:
  ai:
    openai:
      base-url: ${OPENAI_BASE_URL:}
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-oss:20b
          temperature: 0.7
    retry:
      max-attempts: 1
    mcp:
      client:
        enabled: true
        streamable-http:
          connections:
            animal-rescue-backend:
              url: ${animal-rescue.backend-url}
        request-timeout: 20s

animal-rescue:
  backend-url: ${ANIMAL_RESCUE_BACKEND_URL:http://localhost:8080}

logging:
  level:
    io.spring.cloud.samples.animalrescue.chatserver: DEBUG
    io.modelcontextprotocol.client.transport: DEBUG
    org.springframework.ai: DEBUG
