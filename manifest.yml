---
applications:
- name: animal-rescue-frontend
  path: ./frontend/build
  routes:
    - route: animal-rescue-frontend-cs.apps.internal
- name: animal-rescue-backend
  path: ./backend/build/libs/backend-0.0.1-SNAPSHOT.jar
  buildpack: java_buildpack_offline
  memory: 1G
  routes:
    - route: animal-rescue-backend-cs.apps.internal
  env:
    JBP_CONFIG_OPEN_JDK_JRE: '{ jre: { version: 17.+}}'
    JBP_CONFIG_SPRING_BOOT_EFFICIENCY: '{ "spring_aot_enabled": true, "aot_cache_enabled": true }'
- name: animal-rescue-chat-server
  path: ./chat-server/build/libs/chat-server-0.0.1-SNAPSHOT.jar
  buildpack: java_buildpack_offline
  memory: 1G
  routes:
    - route: animal-rescue-chat-server-cs.apps.internal
  env:
    JBP_CONFIG_OPEN_JDK_JRE: '{ jre: { version: 17.+}}'
    #JBP_CONFIG_SPRING_BOOT_EFFICIENCY: '{ "spring_aot_enabled": true, "aot_cache_enabled": true }'
    ANIMAL_RESCUE_BACKEND_URL: http://animal-rescue-backend-cs.apps.internal:8080
